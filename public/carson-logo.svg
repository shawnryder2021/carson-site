<svg width="560" height="116" viewBox="0 0 560 116" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carson Exports — The best place to buy a used car. Period.">
  <defs>
    <clipPath id="disc"><circle cx="58" cy="58" r="48"/></clipPath>
    <path id="ringBottom" d="M 18 58 A 40 40 0 0 0 98 58"/>
  </defs>

  <!-- Emblem -->
  <circle cx="58" cy="58" r="55" fill="#1E8FC4"/>
  <circle cx="58" cy="58" r="48" fill="#1E8FC4" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Globe grid -->
  <g clip-path="url(#disc)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" fill="none">
    <ellipse cx="58" cy="58" rx="20" ry="48"/>
    <ellipse cx="58" cy="58" rx="38" ry="48"/>
    <line x1="10" y1="58" x2="106" y2="58"/>
    <line x1="14" y1="40" x2="102" y2="40"/>
    <line x1="14" y1="76" x2="102" y2="76"/>
  </g>

  <!-- North America landmass (stylized) -->
  <g clip-path="url(#disc)">
    <path d="M30 30c8-4 18-3 24 2 5 4 4 10 9 13 4 2 9 1 11 6 2 6-3 10-7 13-5 4-12 3-17 1-7-3-10-11-17-13-6-2-13-1-16-7-3-7 5-13 13-15z" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- Curved ring text -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.6" fill="#ffffff">
    <textPath href="#ringBottom" startOffset="50%" text-anchor="middle">WORLDWIDE AUTO SALES</textPath>
  </text>

  <!-- Sleek car silhouette across lower third -->
  <g clip-path="url(#disc)">
    <path d="M22 70c3-5 9-9 16-10 5-4 12-7 20-7 9 0 16 3 22 8 5 1 9 3 12 6 2 2 1 5-2 5H24c-3 0-4-5-2-8z" fill="#0b0f14"/>
    <circle cx="38" cy="78" r="5.5" fill="#0b0f14" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="72" cy="78" r="5.5" fill="#0b0f14" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Wordmark (Impact = dealership brand font) -->
  <text x="128" y="62" font-family="Impact, 'Anton', 'Haettenschweiler', 'Arial Narrow', sans-serif" font-size="46" font-style="italic" fill="#0b0f14" letter-spacing="-0.5">CARSONEXPORTS</text>
  <text x="130" y="86" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#0b0f14">The best place to buy a used car. Period.</text>
</svg>
